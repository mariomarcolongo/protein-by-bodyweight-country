name: Validate data pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check source syntax and browser contract
        run: |
          python -m py_compile scripts/build_dataset.py scripts/check_web_contract.py
          node --check web/app-data.js
          node --check web/app-charts.js
          node --check web/app-main.js
          node --check web/app-polish.js
          node --check web/app-reference-dock.js
          cat web/app-polish.js web/app-reference-dock.js > /tmp/app-polish-bundled.js
          node --check /tmp/app-polish-bundled.js
          grep -q 'reference-dock-select' web/app-reference-dock.js
          grep -q 'Customize this range' web/app-reference-dock.js
          grep -q 'installBenchmarkLabV04 = function() {}' web/app-reference-dock.js
          grep -q '.reference-dock-trigger' web/reference-dock.css
          python scripts/check_web_contract.py
      - run: python scripts/build_dataset.py
      - name: Check generated outputs
        run: |
          test -s data/derived/protein_bodyweight_country_year.csv
          test -s data/derived/protein_bodyweight_country_year.json
          test -s data/derived/explorer.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/derived/explorer.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          coverage = payload["metadata"]["coverage"]
          assert payload["countries"], "country dictionary is empty"
          assert payload["rows"], "explorer rows are empty"
          assert len(payload["rows"]) == coverage["records"]
          assert payload["metadata"]["version"] == "0.3.0-preview"
          assert coverage["gdp_records"] >= 5000
          assert coverage["gdp_countries"] >= 175
          assert coverage["gdp_year_min"] == 1990
          assert any(row[6] is not None for row in payload["rows"])
          assert path.stat().st_size < 1_000_000, "browser payload unexpectedly exceeds 1 MB"
          print(
              f"Validated {len(payload['rows']):,} browser rows, "
              f"{coverage['gdp_records']:,} GDP matches across "
              f"{coverage['gdp_countries']} countries, "
              f"in {path.stat().st_size:,} bytes"
          )
          PY
      - name: Check deploy-time chart bundle
        run: curl --fail --head --location --retry 3 https://cdn.plot.ly/plotly-geo-3.5.1.min.js
      - name: Probe current public explorer
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="https://mariomarcolongo.github.io/protein-by-bodyweight-country"
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$base/" --output /tmp/live-index.html
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$base/data/explorer.json" --output /tmp/live-explorer.json
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$base/vendor/plotly-geo-3.5.1.min.js" --output /tmp/live-plotly.js
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$base/app-polish.js" --output /tmp/live-app-polish.js
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$base/polish.css" --output /tmp/live-polish.css

          grep -q 'id="dashboard-shell"' /tmp/live-index.html
          grep -q 'id="country-search"' /tmp/live-index.html
          grep -q 'id="benchmark-select"' /tmp/live-index.html
          grep -q 'id="gdp-chart"' /tmp/live-index.html
          grep -q 'app-polish.js' /tmp/live-index.html
          grep -q 'polish.css' /tmp/live-index.html
          grep -q 'Log income' /tmp/live-app-polish.js
          grep -q 'Linear income' /tmp/live-app-polish.js
          grep -q 'Show active protein reference' /tmp/live-app-polish.js
          grep -q 'EFSA Population Reference Intake' /tmp/live-app-polish.js
          grep -q 'Academy / Dietitians of Canada / ACSM athletes' /tmp/live-app-polish.js
          grep -q 'WHO/FAO/UNU safe level' /tmp/live-app-polish.js
          grep -q 'one persistent protein-reference selector' /tmp/live-app-polish.js
          grep -q 'reference-dock-select' /tmp/live-app-polish.js
          grep -q 'Customize this range' /tmp/live-app-polish.js
          grep -q 'installBenchmarkLabV04 = function() {}' /tmp/live-app-polish.js
          grep -q '.reference-dock-trigger' /tmp/live-polish.css
          grep -q '.reference-dock-panel' /tmp/live-polish.css
          grep -q '.gdp-chart-controls' /tmp/live-polish.css
          test "$(wc -c < /tmp/live-plotly.js)" -gt 100000
          test "$(wc -c < /tmp/live-app-polish.js)" -gt 15000
          test "$(wc -c < /tmp/live-polish.css)" -gt 5000

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/live-explorer.json").read_text(encoding="utf-8"))
          coverage = payload["metadata"]["coverage"]
          assert payload["metadata"]["version"] == "0.3.0-preview"
          assert len(payload["rows"]) == coverage["records"]
          assert coverage["gdp_records"] >= 5000
          assert coverage["gdp_countries"] >= 175
          assert any(row[6] is not None for row in payload["rows"])
          print(
              "Live persistent reference selector verified:",
              f"{len(payload['rows']):,} rows,",
              f"{coverage['gdp_records']:,} GDP matches across",
              f"{coverage['gdp_countries']} countries",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: preview-dataset
          path: data/derived/
          retention-days: 14